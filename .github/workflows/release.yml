name: Release

# Push a tag like v0.2.0 to publish. The tag is the version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Zip
        id: zip
        run: |
          ditto -c -k --keepParent build/CaffeineWatch.app build/CaffeineWatch.zip
          echo "sha256=$(shasum -a 256 build/CaffeineWatch.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/CaffeineWatch.zip --title "$GITHUB_REF_NAME" --generate-notes
      - name: Bump Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set; update Casks/caffeine-watch.rb in omarhoumz/homebrew-tap by hand (sha256 $SHA256)"
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/omarhoumz/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"${GITHUB_REF_NAME#v}\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/caffeine-watch.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "caffeine-watch ${GITHUB_REF_NAME#v}"
          git push
